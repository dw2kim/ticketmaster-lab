services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketmaster
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"

  redis:                       # step 5b: holds as a lock with TTL
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # memory only: a restart forgets all holds
    ports:
      - "6379:6379"

  elasticsearch:               # step 9: search engine (a copy of the events, rebuilt from Postgres)
    image: elasticsearch:9.1.5
    environment:
      discovery.type: single-node          # one server, no cluster
      xpack.security.enabled: "false"      # lab only: no passwords, no TLS
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"    # keep it laptop-sized
    ports:
      - "9200:9200"
