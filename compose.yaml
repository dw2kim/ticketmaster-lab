services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketmaster
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"

  redis:                       # step 5b: holds as a lock with TTL
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # memory only: a restart forgets all holds
    ports:
      - "6379:6379"
