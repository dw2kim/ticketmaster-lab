<rect x="30" y="716" width="1140" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="740" class="t">What the lab measured</text>
<text x="46" y="762" class="lab">(3) 200 buyers, 20 seats: naive sold 28-42.  (4) every fix sold exactly 20.  (5) 200 reservers: exactly 20 holds; a hold expires with no job.</text>
<text x="46" y="782" class="lab">(6) 10,000 buyers: booking p95 30 s -> 4-9 ms behind the waiting room.  (7) cache: 2 -> 0.01 DB calls per request, p95 155 -> 72 ms.</text>
<text x="46" y="802" class="lab">(8) search on 100,000 events: LIKE p95 2.7 s -> full-text 102 ms.  (9) Elasticsearch: finds typos, not faster here, +1 GB memory.</text>
<text x="46" y="822" class="lab">(10) Elasticsearch down 20 s: dual-write lost 143 of 251 changes, the outbox lost 0 (they arrived up to 39 s late).</text>
