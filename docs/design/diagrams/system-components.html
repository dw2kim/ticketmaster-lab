<!doctype html>
<!-- Source of system-components.png. Render: see docs/design/diagrams/README.md -->
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
.t{font-size:15px;font-weight:700}.s{font-size:12.5px}.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.h{font-size:20px;font-weight:700}.small{font-size:11px;fill:#6b7280}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
</defs>
<rect width="1180" height="740" fill="#ffffff"/>
<text x="30" y="40" class="h">Ticketmaster lab: system components</text>
<text x="30" y="62" class="small">One Spring Boot app, three data stores. Orange = step 10 (the outbox). Clock = background job inside the app.</text>

<!-- client -->
<rect x="400" y="80" width="380" height="48" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="590" y="102" text-anchor="middle" class="t">Clients: curl / k6</text>
<text x="590" y="119" text-anchor="middle" class="small">buyers, viewers, searchers, editors</text>
<line x1="590" y1="128" x2="590" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="600" y="150" class="small">HTTP :8080</text>

<!-- app -->
<rect x="30" y="162" width="1120" height="246" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="188" class="t" style="fill:#1d4ed8">Spring Boot app (Java 25, one process)</text>

<!-- packages: 4 cards -->
<g>
 <rect x="50" y="202" width="255" height="190" rx="10" fill="#ffffff" stroke="#93c5fd"/>
 <text x="66" y="226" class="t">event</text>
 <text x="66" y="252" class="m">GET /events/{id}</text>
 <text x="66" y="270" class="s">seat map + details</text>
 <text x="66" y="290" class="s">EventReads (@Cacheable)</text>
 <rect x="60" y="306" width="235" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="5 3"/>
 <text x="70" y="328" class="m" style="fill:#c2410c">PUT /events/{id}</text>
 <text x="70" y="346" class="s">EventUpdates: rename</text>
 <text x="70" y="361" class="small">step 10</text>
</g>
<g>
 <rect x="325" y="202" width="255" height="190" rx="10" fill="#ffffff" stroke="#93c5fd"/>
 <text x="341" y="226" class="t">search</text>
 <text x="341" y="252" class="m">GET /events/search</text>
 <text x="341" y="270" class="s">like | fulltext | elastic</text>
 <text x="341" y="290" class="s">ElasticIndexer (reindex)</text>
 <rect x="335" y="306" width="235" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="5 3"/>
 <text x="345" y="328" class="t" style="fill:#c2410c;font-size:13px">&#9719; OutboxWorker</text>
 <text x="345" y="346" class="s">every 0.5 s, delivers notes</text>
 <text x="345" y="361" class="small">step 10</text>
</g>
<g>
 <rect x="600" y="202" width="255" height="190" rx="10" fill="#ffffff" stroke="#93c5fd"/>
 <text x="616" y="226" class="t">booking</text>
 <text x="616" y="252" class="m">POST /bookings/{eventId}</text>
 <text x="616" y="270" class="s">instant buy (steps 2-4)</text>
 <text x="616" y="296" class="m">POST /bookings/reserve</text>
 <text x="616" y="314" class="s">hold a seat (step 5)</text>
 <text x="616" y="340" class="m">POST /bookings/{id}/confirm</text>
 <text x="616" y="358" class="s">fake payment</text>
 <text x="616" y="388" class="small">holds in Postgres or Redis (5b)</text>
</g>
<g>
 <rect x="875" y="202" width="255" height="190" rx="10" fill="#ffffff" stroke="#93c5fd"/>
 <text x="891" y="226" class="t">queue</text>
 <text x="891" y="252" class="m">POST/GET /events/{id}/queue</text>
 <text x="891" y="270" class="s">waiting room (step 6)</text>
 <text x="891" y="296" class="t" style="font-size:13px">&#9719; QueueAdmitter</text>
 <text x="891" y="314" class="s">lets N people in per tick</text>
 <text x="891" y="344" class="small">booking returns 403 unless</text>
 <text x="891" y="358" class="small">the user was let in</text>
</g>

<!-- arrows to stores -->
<line x1="200" y1="408" x2="200" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="208" y="458" class="small">SQL (JdbcClient)</text>
<line x1="640" y1="408" x2="640" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="648" y="458" class="small">Spring Data Redis</text>
<line x1="900" y1="408" x2="900" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="908" y="458" class="small">HTTP + JSON</text>

<!-- Postgres -->
<rect x="30" y="472" width="360" height="200" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="50" y="498" class="t" style="fill:#4338ca">PostgreSQL :5432</text>
<text x="50" y="516" class="small">THE TRUTH: every sale is recorded here</text>
<text x="50" y="544" class="m">events</text><text x="160" y="544" class="s">+ full-text GIN index</text>
<text x="50" y="566" class="m">tickets</text><text x="160" y="566" class="s">available | reserved | booked</text>
<text x="50" y="588" class="m">bookings</text><text x="160" y="588" class="s">in_progress | confirmed | ...</text>
<rect x="44" y="600" width="332" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="5 3"/>
<text x="54" y="622" class="m" style="fill:#c2410c">outbox</text><text x="160" y="622" class="s">notes: "event N changed"</text>
<text x="54" y="642" class="small">step 10: written in the same transaction as the change</text>

<!-- Redis -->
<rect x="410" y="472" width="360" height="200" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="430" y="498" class="t" style="fill:#b91c1c">Redis :6379</text>
<text x="430" y="516" class="small">short-lived helpers, memory only</text>
<text x="430" y="544" class="m">ticket:{id}</text><text x="560" y="544" class="s">seat holds (5b)</text>
<text x="430" y="566" class="m">event:1:held</text><text x="560" y="566" class="s">held seats, by expiry</text>
<text x="430" y="588" class="m">queue:1</text><text x="560" y="588" class="s">waiting room line (6)</text>
<text x="430" y="610" class="m">admitted:1:*</text><text x="560" y="610" class="s">let in, with TTL (6)</text>
<text x="430" y="632" class="m">event-details:1</text><text x="560" y="632" class="s">page cache (7)</text>
<text x="430" y="654" class="m">seat-map:1</text><text x="560" y="654" class="s">optional cache (7)</text>

<!-- Elasticsearch -->
<rect x="790" y="472" width="360" height="200" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="810" y="498" class="t" style="fill:#047857">Elasticsearch :9200</text>
<text x="810" y="516" class="small">a search COPY, rebuilt from Postgres</text>
<text x="810" y="544" class="m">events</text><text x="890" y="544" class="s">index (step 9)</text>
<text x="810" y="570" class="s">forgives typos: "Sparows" finds Sparrows</text>
<text x="810" y="592" class="s">filled by a reindex at startup</text>
<text x="810" y="614" class="s" style="fill:#c2410c">kept fresh by the OutboxWorker (10)</text>
<text x="810" y="640" class="small">if down: search falls back to Postgres</text>

<!-- outbox flow (orange) -->
<path d="M 295 340 H 315 V 428 H 362 V 598" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#o)"/>
<path d="M 376 630 H 400 V 440 H 452 V 370" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#o)"/>
<path d="M 540 368 V 432 H 1060 V 470" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#o)"/>

<circle cx="362" cy="520" r="11" fill="#ea580c"/><text x="362" y="524" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">1</text>
<circle cx="400" cy="560" r="11" fill="#ea580c"/><text x="400" y="564" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">2</text>
<circle cx="800" cy="432" r="11" fill="#ea580c"/><text x="800" y="436" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">3</text>
<text x="30" y="690" class="s" style="fill:#c2410c"><tspan font-weight="700">Outbox flow (step 10):</tspan>  (1) rename + note in one Postgres transaction  |  (2) worker reads the unsent notes  |  (3) worker sends the event to Elasticsearch</text>

<g transform="translate(30,704)">
 <rect width="16" height="12" rx="3" fill="#eff6ff" stroke="#2563eb"/><text x="22" y="11" class="small">app</text>
 <rect x="70" width="16" height="12" rx="3" fill="#eef2ff" stroke="#4f46e5"/><text x="92" y="11" class="small">source of truth</text>
 <rect x="200" width="16" height="12" rx="3" fill="#fef2f2" stroke="#dc2626"/><text x="222" y="11" class="small">holds, queue, cache</text>
 <rect x="350" width="16" height="12" rx="3" fill="#ecfdf5" stroke="#059669"/><text x="372" y="11" class="small">search copy</text>
 <rect x="460" width="16" height="12" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="3 2"/><text x="482" y="11" class="small">step 10 outbox</text>
</g>
</svg></body></html>
