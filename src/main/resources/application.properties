spring.application.name=ticketmaster-lab
# Where the database is. On your laptop the defaults are used (docker compose).
# In the cloud (Render) these come from environment variables; see docs/deploy.md.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketmaster}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab}

# Render tells the app which port to listen on with PORT; locally it is 8080.
server.port=${PORT:8080}

# Health check for the cloud platform: GET /actuator/health -> {"status":"UP"} when the app,
# Postgres is reachable. Only the health endpoint is exposed.
management.endpoints.web.exposure.include=health
# Redis is left out of health on purpose: Postgres is the record, and the app keeps serving
# without Redis (cache fallback, step 7). Otherwise a Redis blip would make Render stop routing
# traffic to an app that still works.
management.health.redis.enabled=false

# Step 4: which booking code runs (naive | row-lock | occ | conditional).
# Override at startup: ./mvnw spring-boot:run -Dspring-boot.run.arguments=--booking.strategy=occ
booking.strategy=conditional

# Step 5: how long a reserved seat is held for the buyer.
# Watch one expire faster: ./mvnw spring-boot:run -Dspring-boot.run.arguments=--booking.hold-duration=PT30S
booking.hold-duration=PT10M

# Step 5b: where holds live (postgres | redis).
# ./mvnw spring-boot:run -Dspring-boot.run.arguments=--booking.hold-store=redis
booking.hold-store=postgres
# Redis address as one URL; Render provides it as REDIS_URL.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# fail fast when Redis is down (default would wait 60 s)
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# Lab: show the reason in error responses (e.g. "hold expired; payment would be refunded").
spring.web.error.include-message=always

# Step 6: virtual waiting room in front of booking.
# ./mvnw spring-boot:run -Dspring-boot.run.arguments=--queue.enabled=true
queue.enabled=false
# how many people are let in each tick
queue.admit-per-second=50
# how often people are let in (default 1s; use 30s to watch it by hand)
queue.tick=1s
# how long an admitted person may book before they must queue again
queue.admitted-for=PT10M

# Step 7: read-through caches in Redis for GET /events/{id}. PT0S = off.
# Event name, venue, performer: they rarely change, so cache them for long.
cache.event-details-ttl=PT1H
# Seat statuses change every second. Off by default; try PT1S to see the trade-off:
# ./mvnw spring-boot:run -Dspring-boot.run.arguments=--cache.seat-map-ttl=PT1S
cache.seat-map-ttl=PT0S
# On a cache miss, let only one caller load from the database (a lock in Redis); the rest wait.
# Protects the database from a stampede, but every read gets slower. See CacheConfig.
cache.lock-on-miss=false

# Step 8: how GET /events/search finds events (like | fulltext).
# ./mvnw spring-boot:run -Dspring-boot.run.arguments=--search.strategy=like
search.strategy=fulltext

# Step 9: Elasticsearch (search.strategy=elastic). It holds a COPY of the events.
search.elasticsearch.url=http://localhost:9200
# Copy all events from Postgres into Elasticsearch when the app starts.
# ./mvnw spring-boot:run "-Dspring-boot.run.arguments=--search.strategy=elastic --search.reindex-on-start=true"
search.reindex-on-start=false

# Step 10: how a change to an event (PUT /events/{id}) reaches Elasticsearch.
#   none        only at the next reindex (step 9)
#   dual-write  call Elasticsearch right after the commit (can lose changes)
#   outbox      note in the same transaction, OutboxWorker delivers it
# ./mvnw spring-boot:run "-Dspring-boot.run.arguments=--search.strategy=elastic --search.sync=outbox"
search.sync=none
search.outbox-poll=500ms
